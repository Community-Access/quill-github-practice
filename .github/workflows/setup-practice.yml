name: Set up practice

# Run this once in your own copy of the template, from the Actions tab or from
# QUILL. It makes the practice issues, pull requests, release and discussion,
# and makes nothing twice, so it's safe to run again.

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  discussions: write
  actions: write

jobs:
  setup:
    name: Make the practice issues and pull requests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Make the practice items
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/practice/seed.py
